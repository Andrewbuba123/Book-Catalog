<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Library</title>
    <link rel="stylesheet" href="./styles/main.css" />
   <script type="module" src="./js/index.js"></script>.
  </head>
  <body class="page">
    <header class="header page__header">
      <div class="header__logo-group">
        <img class="header__logo-icon" src="./assets/book.svg" alt="Logo" />
        <div class="header__title-group">
          <span class="header__title">The Library</span>
          <p class="header__subtitle">Discover your next favorite book</p>
        </div>
      </div>
    </header>

    <main class="page__main main-layout">
      <section class="hero main-layout__hero">
        <h1 class="hero__title">Discover Your Next Great Read</h1>
        <p class="hero__desc">
          Search millions of books, build your personal library, and never lose
          track of what to read next.
        </p>

        <form class="search-form hero__search-form">
          <img class="search-form__icon" src="./assets/search.svg" alt="Search icon" />
          <input
            class="search-form__input"
            type="text"
            placeholder="Search for books by title or author..."
          />
          <button class="search-form__submit" type="submit">Search</button>
        </form>
      </section>

      <section class="catalog main-layout__catalog">
        <ul class="catalog__list"></ul>
      </section>

      <aside class="favorites main-layout__favorites">
        <div class="favorites__header">
          <img class="favorites__icon" src="./assets/heart.svg" alt="Favorites" />
          <h2 class="favorites__title">Favorites</h2>
        </div>
        <p class="favorites__counter">0 books saved</p>

        <ul class="favorites__list"></ul>
      </aside>
    </main>

    <footer class="footer page__footer">
      <p class="footer__text">Powered by Open Library</p>
    </footer>
  </body>
</html>
